# Sol を主セッションにする場合は、アカウントで利用可能になった時点で次の行を有効化してください。
# 現在の ChatGPT 認証では gpt-5.6-sol が拒否されるため、model は未指定にして利用可能な global 設定を継承します。
# model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[agents.relay_investigator]
config_file = "agents/relay-investigator.toml"

[agents.relay_implementer]
config_file = "agents/relay-implementer.toml"

[agents.relay_implementer_std]
config_file = "agents/relay-implementer-std.toml"

[agents.relay_verifier]
config_file = "agents/relay-verifier.toml"

[agents.relay_mechanic]
config_file = "agents/relay-mechanic.toml"

[agents.relay_reviewer]
config_file = "agents/relay-reviewer.toml"

[agents.relay_fable_reviewer]
config_file = "agents/relay-fable-reviewer.toml"

[tui]
status_line = ["model-with-reasoning", "current-dir"]
status_line_use_colors = true

[tui.keymap.global]
open_transcript = "ctrl-o"
toggle_fast_mode = "meta-o"
open_external_editor = "ctrl-g"

[tui.keymap.chat]
interrupt_turn = "escape"

[tui.keymap.composer]
submit = "enter"
history_search_previous = "ctrl-r"

[tui.keymap.editor]
insert_newline = "ctrl-j"

[tui.keymap.approval]
approve = "y"
deny = "n"
cancel = "escape"

[tui.keymap.pager]
close_transcript = "escape"
half_page_up = "ctrl-u"
page_up = "ctrl-b"
page_down = "ctrl-f"
scroll_down = "ctrl-n"
scroll_up = "ctrl-p"
jump_top = "g"
jump_bottom = "shift-g"
